server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Этот порт используется только для внутренней проверки состояния контейнера.
    # Наружу публикуется только TLS 1.3 на порту 5443.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # REST API сервера (ТЗ 1.3–1.5). Лимит тела — пакет до 200 МБ (ТЗ 9.1)
    # с запасом на реестр и разметку multipart.
    location /api/ {
        proxy_pass http://server:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 210m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
