# HTTPS с TLS 1.3 (ТЗ 12, п.3). Подключается автоматически, если в
# /etc/nginx/certs лежат server.crt и server.key (см. docker/40-tls.sh).

# Базовая защита от перегрузки и подбора пароля (ТЗ 12, п.9): лимиты по IP.
# Запас рассчитан на 100 одновременных инспекторов (ТЗ 11) за общим NAT.
limit_req_zone  $binary_remote_addr zone=inspector_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=inspector_api:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=inspector_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 5443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # REST API сервера (ТЗ 1.3–1.5). Лимит тела — пакет до 200 МБ (ТЗ 9.1)
    # с запасом на реестр и разметку multipart.
    location = /api/v1/auth/login {
        limit_req zone=inspector_login burst=5 nodelay;
        proxy_pass http://server:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=inspector_api burst=200 nodelay;
        limit_conn inspector_conn 50;
        proxy_pass http://server:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 210m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
