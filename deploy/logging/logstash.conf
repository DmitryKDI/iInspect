# Централизованный сбор логов (ТЗ 13, п.3). Сервер и ML-модули пишут
# JSON-строки с полями timestamp, level, service, message, request_id,
# user_id в общий том логов; Logstash отправляет их в Elasticsearch.
# События безопасности — в отдельный индекс со сроком хранения 365 дней.
input {
  file {
    path => ["/logs/**/*.log"]
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
  }
}
filter {
  date { match => ["timestamp", "ISO8601"] target => "@timestamp" }
  if [path] =~ /security/ or [log][file][path] =~ /security/ { mutate { add_field => { "[@metadata][index]" => "inspector-security" } } }
  else { mutate { add_field => { "[@metadata][index]" => "inspector-logs" } } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
